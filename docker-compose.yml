services:
  api:
    build: .
    container_name: dean_office_api
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app_code
      - db_data:/app_code/data
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY required}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8000
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY required}
      - BLIND_INDEX_KEY=${BLIND_INDEX_KEY:?BLIND_INDEX_KEY required}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  db_data:
